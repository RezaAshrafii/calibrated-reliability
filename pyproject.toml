[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrated-reliability"
version = "0.1.0"
description = "Reproducible evaluation of calibrated predictive reliability under structured distribution shift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reza Ashrafi" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11", "xgboost>=2.0", "mapie>=0.8", "pyyaml>=6.0", "click>=8.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "pre-commit>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/calibrated_reliability"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: uses locally available raw research data"]

[tool.coverage.run]
source = ["calibrated_reliability"]
